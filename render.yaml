# Render Blueprint: the BACKEND only (the React frontend is hosted on Vercel).
# It lives in the ROOT of your repository (next to main.py).
services:
  # ---- Backend: FastAPI + SQLite ----
  - type: web
    name: smart-kitchen-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /menu
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENROUTER_API_KEY      # your secret: you type it into the Render dashboard
        sync: false
      - key: ALLOWED_ORIGINS         # your Vercel address, e.g. https://my-kitchen.vercel.app (no trailing slash)
        sync: false
      - key: RESET_TOKEN             # Render invents a random password for the demo reset
        generateValue: true
      - key: AI_MAX_CALLS_PER_HOUR   # spending brake for the AI features
        value: "60"
      - key: OPENROUTER_MAX_TOKENS
        value: "2000"